[package]
name = "ttyd"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws", "tokio", "http1", "multipart"] }
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tower = "0.5"
tower-http = { version = "0.5", features = ["cors"] }
bytes = "1.0"
pty = "0.2"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
mime = "0.3"
mime_guess = "2.0"
zip = "2.2"
