<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTYD - Simple Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #1e1e1e;
        }
        #terminal {
            width: 100%;
            height: 100%;
            padding: 2px;
        }
        /* Prevent xterm from overflowing */
        .xterm-viewport {
            overflow-y: auto !important;
        }
        .xterm-screen {
            max-width: 100%;
        }
        /* Drag and drop overlay */
        #drop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 220, 121, 0.2);
            border: 4px dashed #0dbc79;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            pointer-events: none;
        }
        #drop-overlay.active {
            display: flex;
        }
        #drop-overlay .message {
            background: #0dbc79;
            color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        /* Download button */
        #download-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #2472c8;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }
        #download-btn:hover {
            background: #1e5fa8;
        }
        #download-btn:active {
            background: #194d8a;
        }
        /* File browser modal */
        #file-browser-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        #file-browser-modal.active {
            display: flex;
        }
        .file-browser-content {
            background: #252526;
            border: 1px solid #454545;
            border-radius: 8px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .file-browser-header {
            padding: 20px;
            border-bottom: 1px solid #454545;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-browser-header h2 {
            margin: 0;
            color: #fff;
            font-size: 18px;
        }
        .browser-hint {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }
        .file-browser-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .file-browser-close:hover {
            background: #454545;
        }
        .file-browser-path {
            padding: 10px 20px;
            background: #1e1e1e;
            border-bottom: 1px solid #454545;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-browser-path input {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #454545;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: text;
        }
        .file-browser-path input:focus {
            outline: none;
            border-color: #2472c8;
            background: #454545;
        }
        .file-browser-path input::placeholder {
            color: #888;
        }
        .file-browser-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 2px;
        }
        .file-item:hover {
            background: #2a2d2e;
        }
        .file-item.directory {
            color: #0dbc79;
        }
        .file-item.directory .file-item-name::after {
            content: ' (double-click to enter)';
            font-size: 11px;
            color: #666;
            margin-left: 8px;
        }
        .file-item.file {
            color: #fff;
        }
        .file-item-icon {
            margin-right: 10px;
            font-size: 18px;
        }
        .file-item-name {
            flex: 1;
        }
        .file-item-size {
            color: #888;
            font-size: 12px;
            margin-left: 10px;
        }
        .file-browser-footer {
            padding: 15px 20px;
            border-top: 1px solid #454545;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-cancel {
            background: #3c3c3c;
            color: #fff;
        }
        .btn-cancel:hover {
            background: #4c4c4c;
        }
        .btn-download {
            background: #2472c8;
            color: #fff;
        }
        .btn-download:hover {
            background: #1e5fa8;
        }
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #888;
        }
    </style>
</head>
<body>
    <button id="download-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 12l-4-4h2.5V3h3v5H12l-4 4zm-6 1h12v2H2v-2z"/>
        </svg>
        Download
    </button>

    <!-- File Browser Modal -->
    <div id="file-browser-modal">
        <div class="file-browser-content">
            <div class="file-browser-header">
                <div>
                    <h2>Download File</h2>
                    <div class="browser-hint">Click to select • Double-click folder to enter • Folders download as ZIP</div>
                </div>
                <button class="file-browser-close" onclick="closeFileBrowser()">&times;</button>
            </div>
            <div class="file-browser-path">
                <input type="text" id="current-path-input" placeholder="Enter path and press Enter (e.g., /home/user or ../subfolder)">
            </div>
            <div class="file-browser-list" id="file-list">
                <div class="loading-spinner">Loading...</div>
            </div>
            <div class="file-browser-footer">
                <button class="btn btn-cancel" onclick="closeFileBrowser()">Cancel</button>
                <button class="btn btn-download" id="download-selected-btn" disabled>Download</button>
            </div>
        </div>
    </div>

    <div id="drop-overlay">
        <div class="message">Drop file to upload</div>
    </div>
    <div id="terminal"></div>
    <script>
        // Create xterm.js instance
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'Consolas, "Courier New", monospace',
            theme: {
                background: '#1e1e1e',
                foreground: '#ffffff',
                cursor: '#ffffff',
                black: '#000000',
                red: '#cd3131',
                green: '#0dbc79',
                yellow: '#e5e510',
                blue: '#2472c8',
                magenta: '#bc3fbc',
                cyan: '#11a8cd',
                white: '#e5e5e5',
                brightBlack: '#666666',
                brightRed: '#f14c4c',
                brightGreen: '#23d18b',
                brightYellow: '#f5f543',
                brightBlue: '#3b8eea',
                brightMagenta: '#d670d6',
                brightCyan: '#29b8db',
                brightWhite: '#ffffff'
            }
        });

        // Mount terminal to DOM
        term.open(document.getElementById('terminal'));

        // Get actual cell dimensions by measuring
        const getCellDimensions = () => {
            // Estimate based on font size (14px)
            // Most monospace fonts at 14px are approximately 8.4x18 pixels
            return { width: 8.4, height: 18 };
        };

        // Resize terminal to fit container
        const fitTerminal = () => {
            const container = document.getElementById('terminal');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Get actual character dimensions
            const cell = getCellDimensions();

            // Calculate cols and rows with margin to prevent overflow
            // Use 8px margin for padding and borders
            const cols = Math.max(1, Math.floor((width - 8) / cell.width));
            const rows = Math.max(1, Math.floor((height - 8) / cell.height));

            console.log(`Terminal size: ${cols}x${rows}, container: ${width}x${height}`);
            term.resize(cols, rows);
        };

        // Initial fit and resize on window change
        fitTerminal();
        window.addEventListener('resize', () => {
            fitTerminal();
            // Notify server of new size if connected
            if (wsConnected) {
                const resize = {
                    cols: term.cols,
                    rows: term.rows
                };
                ws.send(JSON.stringify(resize));
            }
        });

        // Track WebSocket connection state
        let wsConnected = false;
        let pendingInput = [];

        // Connect to WebSocket server
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            console.log('WebSocket connected');
            wsConnected = true;

            // Fit terminal to window size
            fitTerminal();

            // Send terminal size
            const resize = {
                cols: term.cols,
                rows: term.rows
            };
            ws.send(JSON.stringify(resize));

            // Send any pending input
            while (pendingInput.length > 0) {
                const data = pendingInput.shift();
                ws.send(data);
            }
        };

        ws.onmessage = (event) => {
            // Write data from PTY to terminal
            term.write(event.data);
        };

        ws.onclose = () => {
            console.log('WebSocket disconnected');
            wsConnected = false;
            term.write('\r\n\x1b[31mConnection closed\x1b[0m');
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        // Send user input to PTY
        term.onData(data => {
            if (wsConnected) {
                ws.send(data);
            } else {
                // Buffer input until WebSocket is connected
                pendingInput.push(data);
            }
        });

        // Drag and drop file upload
        const dropOverlay = document.getElementById('drop-overlay');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        // Highlight drop area when dragging over
        ['dragenter', 'dragover'].forEach(eventName => {
            document.body.addEventListener(eventName, () => {
                dropOverlay.classList.add('active');
            }, false);
        });

        // Remove highlight when dragging leaves
        ['dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, () => {
                dropOverlay.classList.remove('active');
            }, false);
        });

        // Handle file drop
        document.body.addEventListener('drop', async (e) => {
            const dt = e.dataTransfer;
            const items = dt.items;

            if (items) {
                // Use DataTransferItemList interface to access directories
                const files = [];
                for (let i = 0; i < items.length; i++) {
                    const item = items[i].webkitGetAsEntry();
                    if (item) {
                        await traverseFileTree(item, '', files);
                    }
                }
                term.write('\r\n\x1b[33mPreparing to upload ' + files.length + ' files...\x1b[0m\r\n');
                // Upload all collected files with progress tracking
                let successCount = 0;
                let failCount = 0;
                for (let i = 0; i < files.length; i++) {
                    const fileData = files[i];
                    term.write(`\x1b[90m[${i + 1}/${files.length}]\x1b[0m Uploading: ${fileData.path}\r\n`);
                    const success = await uploadFile(fileData.file, fileData.path);
                    if (success) successCount++;
                    else failCount++;
                }
                term.write('\r\n\x1b[36mUpload complete: ' + successCount + ' succeeded, ' + failCount + ' failed\x1b[0m\r\n');
            } else {
                // Fallback for browsers that don't support webkitGetAsEntry
                const files = dt.files;
                term.write('\r\n\x1b[33mUploading ' + files.length + ' files...\x1b[0m\r\n');
                for (let i = 0; i < files.length; i++) {
                    await uploadFile(files[i], files[i].name);
                }
            }
        }, false);

        // Traverse file tree for directory upload support
        async function traverseFileTree(item, path, files) {
            if (item.isFile) {
                return new Promise((resolve) => {
                    item.file((file) => {
                        files.push({ file, path: path + file.name });
                        resolve();
                    });
                });
            } else if (item.isDirectory) {
                const dirReader = item.createReader();
                const entries = await new Promise((resolve) => {
                    dirReader.readEntries(resolve);
                });

                for (const entry of entries) {
                    await traverseFileTree(entry, path + item.name + '/', files);
                }
            }
        }

        // Upload file to server with retry logic
        async function uploadFile(file, path, maxRetries = 3) {
            const formData = new FormData();
            // Use Blob for binary files to ensure proper encoding
            const blob = file instanceof Blob ? file : new Blob([file], { type: file.type || 'application/octet-stream' });
            formData.append('file', blob, path);

            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Upload-Path': path
                        }
                    });

                    if (response.ok) {
                        const result = await response.text();
                        term.write('  \x1b[32m✓\x1b[0m ' + result + '\r\n');
                        return true;
                    } else {
                        const errorText = await response.text();
                        if (attempt === maxRetries) {
                            term.write('  \x1b[31m✗\x1b[0m Failed: ' + errorText + '\r\n');
                        }
                    }
                } catch (error) {
                    if (attempt === maxRetries) {
                        term.write('  \x1b[31m✗\x1b[0m Network error: ' + error.message + '\r\n');
                    } else {
                        // Wait before retry (exponential backoff)
                        await new Promise(resolve => setTimeout(resolve, 1000 * attempt));
                    }
                }
            }
            return false;
        }

        // Download file functionality - open file browser
        const downloadBtn = document.getElementById('download-btn');
        downloadBtn.addEventListener('click', () => {
            openFileBrowser('.');
        });

        // File browser state
        let currentBrowserPath = '.';
        let selectedFile = null;

        // Open file browser modal
        function openFileBrowser(path) {
            selectedFile = null;
            document.getElementById('file-browser-modal').classList.add('active');
            document.getElementById('download-selected-btn').disabled = true;
            loadDirectory(path);
        }

        // Close file browser modal
        function closeFileBrowser() {
            document.getElementById('file-browser-modal').classList.remove('active');
            selectedFile = null;
        }

        // Path input - handle Enter key
        document.getElementById('current-path-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const newPath = e.target.value.trim();
                if (newPath) {
                    currentBrowserPath = newPath;
                    selectedFile = null;
                    document.getElementById('download-selected-btn').disabled = true;
                    loadDirectory(newPath);
                }
            }
        });

        // Load directory contents
        async function loadDirectory(path) {
            const fileList = document.getElementById('file-list');
            const pathInput = document.getElementById('current-path-input');
            pathInput.value = path;
            fileList.innerHTML = '<div class="loading-spinner">Loading...</div>';

            try {
                const encodedPath = encodeURIComponent(path);
                const response = await fetch(`/ls?path=${encodedPath}`);

                if (response.ok) {
                    const data = await response.json();
                    pathInput.value = data.current_path;
                    // Update currentBrowserPath to the actual path from server
                    currentBrowserPath = data.current_path;
                    renderFileList(data.files);
                } else {
                    fileList.innerHTML = '<div class="loading-spinner">Failed to load directory</div>';
                }
            } catch (error) {
                fileList.innerHTML = '<div class="loading-spinner">Error: ' + error.message + '</div>';
            }
        }

        // Render file list
        function renderFileList(files) {
            const fileList = document.getElementById('file-list');
            fileList.innerHTML = '';

            if (files.length === 0) {
                fileList.innerHTML = '<div class="loading-spinner">Directory is empty</div>';
                return;
            }

            // Add parent directory link if not at root
            if (currentBrowserPath !== '.' && currentBrowserPath !== '/') {
                const parentItem = document.createElement('div');
                parentItem.className = 'file-item directory';
                parentItem.innerHTML = '<span class="file-item-icon">📁</span><span class="file-item-name">.. (parent)</span>';
                parentItem.onclick = () => {
                    // Calculate parent directory path
                    let parentPath;
                    if (currentBrowserPath.includes('/')) {
                        // For paths like /home/user or /home/user/docs
                        const parts = currentBrowserPath.split('/');
                        parts.pop(); // Remove last segment
                        parentPath = parts.join('/') || '/';
                    } else {
                        // For relative paths like subfolder or subfolder/inner
                        const parts = currentBrowserPath.split('/');
                        parts.pop();
                        parentPath = parts.join('/') || '.';
                    }
                    openFileBrowser(parentPath);
                };
                fileList.appendChild(parentItem);
            }

            files.forEach(file => {
                const item = document.createElement('div');
                item.className = `file-item ${file.is_dir ? 'directory' : 'file'}`;
                const icon = file.is_dir ? '📁' : '📄';
                const size = file.size ? formatFileSize(file.size) : '';
                item.innerHTML = `
                    <span class="file-item-icon">${icon}</span>
                    <span class="file-item-name">${file.name}</span>
                    ${size ? `<span class="file-item-size">${size}</span>` : ''}
                `;

                // Single click: select the file/folder
                item.onclick = () => {
                    // Clear previous selection
                    document.querySelectorAll('.file-item').forEach(el => el.style.background = '');
                    item.style.background = '#2472c8';
                    selectedFile = file;
                    document.getElementById('download-selected-btn').disabled = false;
                };

                // Double click: enter directory
                item.ondblclick = () => {
                    if (file.is_dir) {
                        // Build the correct path for the subdirectory
                        let newPath;
                        if (currentBrowserPath === '.') {
                            newPath = file.name;
                        } else {
                            newPath = currentBrowserPath + '/' + file.name;
                        }
                        openFileBrowser(newPath);
                    }
                };

                fileList.appendChild(item);
            });
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }

        // Download selected file
        document.getElementById('download-selected-btn').addEventListener('click', async () => {
            if (!selectedFile) return;

            // Use the full absolute path from server response
            await downloadFile(selectedFile.path, selectedFile.is_dir);
            closeFileBrowser();
        });

        // Download file from server
        async function downloadFile(path, isDir = false) {
            try {
                term.write('\r\n\x1b[33mDownloading: ' + path + (isDir ? ' (as ZIP)' : '') + '\x1b[0m\r\n');

                const encodedPath = encodeURIComponent(path);
                const response = await fetch(`/download?path=${encodedPath}`);

                if (response.ok) {
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = path.split('/').pop();

                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename="(.+)"/);
                        if (filenameMatch) {
                            filename = filenameMatch[1];
                        }
                    }

                    // Create blob and download link
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    term.write('\r\n\x1b[32m✓ Downloaded: ' + filename + '\x1b[0m\r\n');
                } else {
                    const errorText = await response.text();
                    term.write('\r\n\x1b[31m✗ Download failed: ' + errorText + '\x1b[0m\r\n');
                }
            } catch (error) {
                term.write('\r\n\x1b[31m✗ Download error: ' + error.message + '\x1b[0m\r\n');
            }
        }
    </script>
</body>
</html>
