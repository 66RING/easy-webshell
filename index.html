<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTYD - Simple Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            background: #1e1e1e;
        }
        #terminal {
            width: 100%;
            height: 100%;
            padding: 2px;
        }
        /* Prevent xterm from overflowing */
        .xterm-viewport {
            overflow-y: auto !important;
        }
        .xterm-screen {
            max-width: 100%;
        }
        /* Drag and drop overlay */
        #drop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 220, 121, 0.2);
            border: 4px dashed #0dbc79;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            pointer-events: none;
        }
        #drop-overlay.active {
            display: flex;
        }
        #drop-overlay .message {
            background: #0dbc79;
            color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="drop-overlay">
        <div class="message">Drop file to upload</div>
    </div>
    <div id="terminal"></div>
    <script>
        // Create xterm.js instance
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'Consolas, "Courier New", monospace',
            theme: {
                background: '#1e1e1e',
                foreground: '#ffffff',
                cursor: '#ffffff',
                black: '#000000',
                red: '#cd3131',
                green: '#0dbc79',
                yellow: '#e5e510',
                blue: '#2472c8',
                magenta: '#bc3fbc',
                cyan: '#11a8cd',
                white: '#e5e5e5',
                brightBlack: '#666666',
                brightRed: '#f14c4c',
                brightGreen: '#23d18b',
                brightYellow: '#f5f543',
                brightBlue: '#3b8eea',
                brightMagenta: '#d670d6',
                brightCyan: '#29b8db',
                brightWhite: '#ffffff'
            }
        });

        // Mount terminal to DOM
        term.open(document.getElementById('terminal'));

        // Get actual cell dimensions by measuring
        const getCellDimensions = () => {
            // Estimate based on font size (14px)
            // Most monospace fonts at 14px are approximately 8.4x18 pixels
            return { width: 8.4, height: 18 };
        };

        // Resize terminal to fit container
        const fitTerminal = () => {
            const container = document.getElementById('terminal');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Get actual character dimensions
            const cell = getCellDimensions();

            // Calculate cols and rows with margin to prevent overflow
            // Use 8px margin for padding and borders
            const cols = Math.max(1, Math.floor((width - 8) / cell.width));
            const rows = Math.max(1, Math.floor((height - 8) / cell.height));

            console.log(`Terminal size: ${cols}x${rows}, container: ${width}x${height}`);
            term.resize(cols, rows);
        };

        // Initial fit and resize on window change
        fitTerminal();
        window.addEventListener('resize', () => {
            fitTerminal();
            // Notify server of new size if connected
            if (wsConnected) {
                const resize = {
                    cols: term.cols,
                    rows: term.rows
                };
                ws.send(JSON.stringify(resize));
            }
        });

        // Track WebSocket connection state
        let wsConnected = false;
        let pendingInput = [];

        // Connect to WebSocket server
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            console.log('WebSocket connected');
            wsConnected = true;

            // Fit terminal to window size
            fitTerminal();

            // Send terminal size
            const resize = {
                cols: term.cols,
                rows: term.rows
            };
            ws.send(JSON.stringify(resize));

            // Send any pending input
            while (pendingInput.length > 0) {
                const data = pendingInput.shift();
                ws.send(data);
            }
        };

        ws.onmessage = (event) => {
            // Write data from PTY to terminal
            term.write(event.data);
        };

        ws.onclose = () => {
            console.log('WebSocket disconnected');
            wsConnected = false;
            term.write('\r\n\x1b[31mConnection closed\x1b[0m');
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        // Send user input to PTY
        term.onData(data => {
            if (wsConnected) {
                ws.send(data);
            } else {
                // Buffer input until WebSocket is connected
                pendingInput.push(data);
            }
        });

        // Drag and drop file upload
        const dropOverlay = document.getElementById('drop-overlay');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, false);
        });

        // Highlight drop area when dragging over
        ['dragenter', 'dragover'].forEach(eventName => {
            document.body.addEventListener(eventName, () => {
                dropOverlay.classList.add('active');
            }, false);
        });

        // Remove highlight when dragging leaves
        ['dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, () => {
                dropOverlay.classList.remove('active');
            }, false);
        });

        // Handle file drop
        document.body.addEventListener('drop', async (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                const file = files[0];
                await uploadFile(file);
            }
        }, false);

        // Upload file to server
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const result = await response.text();
                    term.write('\r\n\x1b[32m' + result + '\x1b[0m\r\n');
                } else {
                    term.write('\r\n\x1b[31mUpload failed: ' + response.statusText + '\x1b[0m\r\n');
                }
            } catch (error) {
                term.write('\r\n\x1b[31mUpload error: ' + error.message + '\x1b[0m\r\n');
            }
        }
    </script>
</body>
</html>
