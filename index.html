<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTYD - Simple Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
</head>
<body>
    <button id="download-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 12l-4-4h2.5V3h3v5H12l-4 4zm-6 1h12v2H2v-2z"/>
        </svg>
        Download
    </button>

    <!-- Login Modal -->
    <div id="login-modal">
        <div class="login-content">
            <h2>Authentication Required</h2>
            <p class="login-hint">Please log in to access the terminal</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <div class="form-error" id="login-error" style="display: none;"></div>
                <button type="submit" class="btn-login">Login</button>
            </form>
        </div>
    </div>

    <!-- File Browser Modal -->
    <div id="file-browser-modal">
        <div class="file-browser-content">
            <div class="file-browser-header">
                <div>
                    <h2>Download File</h2>
                    <div class="browser-hint">Click to select • Double-click folder to enter • Folders download as ZIP</div>
                </div>
                <button class="file-browser-close" onclick="closeFileBrowser()">&times;</button>
            </div>
            <div class="file-browser-path">
                <input type="text" id="current-path-input" placeholder="Enter path and press Enter (e.g., /home/user or ../subfolder)">
            </div>
            <div class="file-browser-list" id="file-list">
                <div class="loading-spinner">Loading...</div>
            </div>
            <div class="file-browser-footer">
                <button class="btn btn-cancel" onclick="closeFileBrowser()">Cancel</button>
                <button class="btn btn-download" id="download-selected-btn" disabled>Download</button>
            </div>
        </div>
    </div>

    <div id="drop-overlay">
        <div class="message">Drop file to upload</div>
    </div>
    <div id="terminal"></div>
    <script src="app.js"></script>
</body>
</html>
